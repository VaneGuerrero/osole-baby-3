<!DOCTYPE html>
<!-- O'Sole Baby · Filtro de fotos · v1.1.1 (2026-11-02) · ver CHANGELOG.md -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O'Sole Baby · ¡Hazte una foto!</title>
<style>
  :root { --bg:#ecf7f6; --ink:#0a5c57; --pink:#ff5176; --teal:#0e9488; --purple:#b57bd0; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; justify-content:safe center; gap:10px;
         padding:calc(env(safe-area-inset-top) + 4px) 10px calc(env(safe-area-inset-bottom) + 78px); gap:8px; }
  /* Fondo decorativo sutil */
  #bg { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
        background:linear-gradient(#e6f4f3 0%, #f1faf8 55%, #e9f5ec 100%); }
  #bg svg { position:absolute; display:block; }
  #bg .sun    { top:-5vmin; left:-5vmin; width:clamp(110px,26vmin,240px); opacity:.5; }
  #bg .cloud1 { top:7vh; right:3vw; width:clamp(90px,22vmin,200px); opacity:.55; }
  #bg .cloud2 { top:38vh; left:2vw; width:clamp(60px,14vmin,130px); opacity:.45; }
  #bg .cloud3 { top:58vh; right:1vw; width:clamp(70px,16vmin,150px); opacity:.45; }
  #bg .star   { width:clamp(10px,2.2vmin,18px); opacity:.55; }
  #bg .rainbow{ bottom:9vh; left:-2vw; width:clamp(90px,20vmin,190px); opacity:.35; }
  #bg .hills  { bottom:0; left:0; width:100%; height:15vh; opacity:.4; }
  #bg .leaves { bottom:-1vh; right:-1vw; width:clamp(90px,22vmin,210px); opacity:.35; }
  #bg .leaf2  { bottom:-1vh; left:-1vw; width:clamp(70px,16vmin,150px); opacity:.3; }
  #bg .daisy  { bottom:4vh; left:18vw; width:clamp(18px,4vmin,34px); opacity:.55; }
  /* Monito del fondo */
  #monkey { position:absolute; left:0; bottom:0; width:84px; will-change:transform; }
  #monkey .m-in { position:relative; transform-origin:50% 100%; }
  #monkey img { display:block; width:100%; height:auto; }
  #monkey .m-arm { position:absolute; inset:0; width:100%; height:100%; overflow:visible; opacity:0; }
  #monkey.wave .m-arm { opacity:1; }
  #monkey .m-arm .swing { transform-box:view-box; transform-origin:262px 215px; transform:rotate(60deg); }
  #monkey.wave .m-arm .swing { animation:hello .55s ease-in-out infinite alternate; }
  @keyframes hello { from { transform:rotate(38deg); } to { transform:rotate(82deg); } }
  #monkey .m-hi { position:absolute; left:50%; bottom:100%; transform:translate(-50%,6px) scale(.6); margin-bottom:2px;
        background:#fff; color:#e0345c; font:800 13px/1 system-ui,sans-serif; padding:6px 10px; border-radius:14px;
        white-space:nowrap; opacity:0; transition:opacity .25s, transform .25s; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  #monkey .m-hi::after { content:""; position:absolute; left:50%; top:100%; margin-left:-5px;
        border:5px solid transparent; border-top-color:#fff; }
  #monkey.wave .m-hi { opacity:1; transform:translate(-50%,0) scale(1); }
  #mound { position:absolute; left:0; right:0; bottom:0; height:46px; display:block; }
  /* Animaciones suaves del fondo */
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes twinkle { 0%,100% { opacity:1; } 50% { opacity:.15; } }
  @keyframes driftA { 0%,100% { transform:translateX(-22px); } 50% { transform:translateX(22px); } }
  @keyframes driftB { 0%,100% { transform:translateX(18px); } 50% { transform:translateX(-18px); } }
  @keyframes sway { 0%,100% { transform:rotate(-4deg); } 50% { transform:rotate(4deg); } }
  @keyframes bob { 0%,100% { transform:rotate(-8deg) translateY(0); } 50% { transform:rotate(8deg) translateY(-3px); } }
  @keyframes starPulse { 0%,100% { opacity:.25; transform:scale(.8); } 50% { opacity:.7; transform:scale(1.1); } }
  #bg .spin { transform-box:view-box; transform-origin:70px 70px; animation:spin 40s linear infinite; }
  #bg .ray { animation:twinkle 2.6s ease-in-out infinite; }
  #bg .r2 { animation-delay:.5s; } #bg .r3 { animation-delay:1s; } #bg .r4 { animation-delay:1.5s; } #bg .r5 { animation-delay:2s; }
  #bg .cloud1 { animation:driftA 16s ease-in-out infinite; }
  #bg .cloud2 { animation:driftB 20s ease-in-out infinite; }
  #bg .cloud3 { animation:driftA 24s ease-in-out infinite; }
  #bg .leaves { transform-origin:60% 100%; animation:sway 7s ease-in-out infinite; }
  #bg .leaf2  { transform-origin:30% 100%; animation:sway 9s ease-in-out infinite reverse; }
  #bg .daisy  { animation:bob 6s ease-in-out infinite; }
  #bg .star   { animation:starPulse 3.5s ease-in-out infinite; }
  #bg .star:nth-of-type(even) { animation-delay:1.2s; }
  @media (prefers-reduced-motion: reduce) { #bg *, #bg { animation:none !important; } }
  h1 { font-size:.95rem; margin:0; text-align:center; }
  #main { display:flex; align-items:center; justify-content:center; gap:8px; }
  #stage { position:relative; height:min(calc(100dvh - 214px), calc((100vw - 92px) * 16 / 9)); aspect-ratio:9/16; flex:none; border-radius:14px; overflow:hidden;
           background:#fff; box-shadow:0 6px 24px rgba(11,61,145,.18); touch-action:pan-y; }
  #cam { position:absolute; left:0; top:0; width:100%; height:100%; }
  #cam.mirror { transform:scaleX(-1); }
  #frameImg, #result { position:absolute; inset:0; width:100%; height:100%; }
  #frameImg { pointer-events:none; }
  #result { display:none; }
  #thumbs { display:flex; flex-direction:column; gap:10px; flex:none; }
  .thumb { width:58px; padding:0; border:3px solid transparent; border-radius:12px; background:#fff; overflow:hidden;
           display:flex; flex-direction:column; align-items:center; font-size:.7rem; font-weight:700; color:var(--ink); }
  .thumb img { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; }
  .thumb span { padding:2px 0; }
  .thumb.active { border-color:var(--pink); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #done { flex-direction:column; align-items:stretch; flex-wrap:nowrap; width:min(340px,90vw); gap:8px; }
  #done button { width:100%; padding:10px 16px; font-size:.92rem; line-height:1.2; }
  button { font:inherit; font-weight:700; border:0; border-radius:999px; padding:12px 24px;
           background:var(--pink); color:#fff; cursor:pointer; }
  button.sec { background:#fff; color:#e0345c; border:2px solid var(--pink); }
  button { box-shadow:0 3px 10px rgba(255,81,118,.28); transition:transform .12s; }
  button.ig { box-shadow:0 3px 10px rgba(14,148,136,.3); }
  button:active { transform:scale(.97); }
  #msg { font-size:.85rem; text-align:center; max-width:360px; min-height:2.4em; margin:0; }
  #flip.sec { color:var(--teal); border-color:var(--teal); }
  button.ig { background:var(--teal); }
  /* Pantalla de resultado: sin miniaturas, marco centrado y un poco más bajo para que quepan los 3 botones */
  body.done #thumbs { display:none; }
  body.done #stage { height:min(calc(100dvh - 290px), calc((100vw - 24px) * 16 / 9)); }
  body.done #msg { min-height:1.3em; }
  #ver { position:fixed; top:3px; right:7px; font:600 10px/1 system-ui,sans-serif; color:var(--ink); opacity:.45; pointer-events:none; z-index:5; }
  /* Panel de debug */
  #dbg { position:fixed; left:0; right:0; top:0; z-index:9999; max-height:34vh; display:flex; flex-direction:column;
         background:rgba(8,22,24,.94); color:#bff3e4; font:11px/1.35 ui-monospace,Menlo,Consolas,monospace; }
  #dbg .dbg-bar { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:6px 8px; background:#0d3b38; color:#fff; flex-wrap:wrap; }
  #dbg button { font:600 11px/1 system-ui,sans-serif; padding:6px 9px; border-radius:6px; background:#2b6b66; color:#fff; box-shadow:none; margin-left:4px; }
  #dbg-out { margin:0; padding:8px; overflow:auto; white-space:pre-wrap; word-break:break-all; -webkit-user-select:text; user-select:text; }
  [hidden] { display:none !important; }
</style>
</head>

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const UA = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const inApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|MicroMessenger|Snapchat|TikTok|Telegram/i.test(UA);
const APP_HINT = inApp ? " Estás en el navegador de otra app: abre el enlace en Chrome o Safari." : "";

/* ---------- Registro (siempre activo) y panel de debug (opcional) ----------
   Abrir el panel:  añadir ?debug=1 al enlace  ·  o tocar 5 veces el título.      */
const T0 = performance.now(), LOG = [];
let dbgOpen = false, dbgTimer = 0, fps = 0;
function dbg(tag, text, data) {
  let line = ((performance.now() - T0) / 1000).toFixed(2) + "s [" + tag + "] " + text;
  if (data !== undefined) { try { line += " " + (typeof data === "string" ? data : JSON.stringify(data)); } catch (e) {} }
  LOG.push(line); if (LOG.length > 400) LOG.shift();
  dbgRender();
}
addEventListener("error", e => dbg("ERROR", (e.message || "error") + " @" + String(e.filename || "").split("/").pop() + ":" + e.lineno));
addEventListener("unhandledrejection", e => dbg("ERROR", "promesa: " + (e.reason && (e.reason.name + ": " + e.reason.message) || e.reason)));
document.addEventListener("visibilitychange", () => dbg("pagina", "visibilidad: " + document.visibilityState));

async function dbgReport() {
  const L = [], add = (k, v) => L.push(k + ": " + v);
  add("versión", APP_VERSION + " (" + APP_DATE + ")");
  add("hora", new Date().toISOString());
  add("url", location.href);
  add("https/seguro", window.isSecureContext);
  add("navegador", UA);
  add("pantalla", innerWidth + "x" + innerHeight + " @" + devicePixelRatio + "x");
  add("iPhone / app interna", isIOS + " / " + inApp);
  add("mediaDevices", !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
  add("permiso cámara", await camState());
  add("visibilidad", document.visibilityState);
  add("estado", "stream=" + !!stream + " iniciando=" + starting + " foto=" + finished + " marco=" + FRAMES[idx].id + " espejo=" + mirrored);
  const tr = stream && stream.getVideoTracks()[0];
  if (tr) { const s = tr.getSettings ? tr.getSettings() : {};
    add("cámara activa", (tr.label || "?") + " " + s.width + "x" + s.height + " @" + (s.frameRate || "?") + "fps facing=" + (s.facingMode || "n/d") + " estado=" + tr.readyState); }
  add("video", cam.videoWidth + "x" + cam.videoHeight + " ready=" + cam.readyState);
  add("marcos cargados", FRAMES.map(f => f.id + ":" + (f.img.complete && f.img.naturalWidth > 0)).join(" "));
  try { add("compartir archivos", !!(navigator.canShare && navigator.canShare({ files: [new File(["x"], "x.jpg", { type: "image/jpeg" })] }))); } catch (e) { add("compartir archivos", "error"); }
  try { const d = await navigator.mediaDevices.enumerateDevices(); add("cámaras detectadas", d.filter(x => x.kind === "videoinput").length); } catch (e) {}
  add("fps de la página", fps || "n/d");
  return L.join("\n") + "\n--- registro ---\n" + LOG.join("\n");
}
function dbgRender() {
  if (!dbgOpen || dbgTimer) return;
  dbgTimer = setTimeout(async () => {
    dbgTimer = 0;
    const out = $("dbg-out"); if (!out) return;
    const stick = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
    out.textContent = await dbgReport();
    if (stick) out.scrollTop = out.scrollHeight;
  }, 120);
}
async function copyReport(btn) {
  const text = await dbgReport(); let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
  if (!ok) { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); }
  btn.textContent = ok ? "¡Copiado!" : "No se pudo copiar";
  setTimeout(() => { btn.textContent = "Copiar informe"; }, 1600);
}
function dbgSet(on) {
  dbgOpen = on;
  if (on && !$("dbg")) {
    const d = document.createElement("div"); d.id = "dbg";
    d.innerHTML = '<div class="dbg-bar"><b>DEBUG v' + APP_VERSION + '</b><span><button data-a="copy">Copiar informe</button><button data-a="clear">Limpiar</button><button data-a="close">Cerrar</button></span></div><pre id="dbg-out"></pre>';
    d.addEventListener("click", e => {
      const a = e.target.dataset && e.target.dataset.a;
      if (a === "close") dbgSet(false);
      if (a === "clear") { LOG.length = 0; dbgRender(); }
      if (a === "copy") copyReport(e.target);
    });
    document.body.appendChild(d);
  }
  if ($("dbg")) $("dbg").hidden = !on;
  if (on) {
    let n = 0, t = performance.now();
    (function tick(now) { if (!dbgOpen) { fps = 0; return; } n++; if (now - t >= 1000) { fps = n; n = 0; t = now; dbgRender(); } requestAnimationFrame(tick); })(t);
    dbgRender();
  }
}
{ let taps = 0, last = 0;
  $("title").addEventListener("click", () => {
    const n = performance.now(); taps = (n - last < 1500) ? taps + 1 : 1; last = n;
    if (taps >= 5) { taps = 0; dbgSet(!dbgOpen); }
  });
}
$("ver").textContent = "v" + APP_VERSION;
document.documentElement.dataset.version = APP_VERSION;
dbg("inicio", "versión " + APP_VERSION + " cargada", { ua: UA, https: window.isSecureContext, iOS: isIOS, appInterna: inApp });

const cam = $("cam"), frameImg = $("frameImg"), result = $("result"), msg = $("msg"), stage = $("stage");
let stream = null, facing = "user", mirrored = true, blob = null, photoURL = "", idx = 0;
let finished = false, starting = false, shooting = false, going = false;
let resumeOnShow = false, needPerm = false, autoRetried = false, permStatus = null;

FRAMES.forEach(f => { f.img = new Image(); f.img.src = f.src; });

/* ---------- Carrusel ---------- */
const thumbs = $("thumbs");
FRAMES.forEach((f, i) => {
  const b = document.createElement("button");
  b.className = "thumb"; b.setAttribute("aria-label", f.name);
  b.innerHTML = '<img alt=""><span>' + f.name + '</span>';
  b.querySelector("img").src = f.src;
  b.onclick = () => select(i);
  thumbs.appendChild(b);
});
function select(i) {
  idx = (i + FRAMES.length) % FRAMES.length;
  frameImg.src = FRAMES[idx].src;
  [...thumbs.children].forEach((t, k) => t.classList.toggle("active", k === idx));
  layout();
  dbg("ui", "marco: " + FRAMES[idx].id);
}
let sx = null;
stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (sx === null || finished) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) select(idx + (dx < 0 ? 1 : -1));
}, { passive: true });

/* ---------- Cámara centrada en el círculo del marco elegido ---------- */
function fit() {
  const f = FRAMES[idx], vw = cam.videoWidth, vh = cam.videoHeight;
  const s = f.d / (ZOOM * Math.min(vw, vh));
  return { dw: vw * s, dh: vh * s, f };
}
function layout() {
  if (!cam.videoWidth) return;
  const { dw, dh, f } = fit();
  cam.style.width = (dw / W * 100) + "%";
  cam.style.height = (dh / H * 100) + "%";
  cam.style.left = ((f.hx - dw / 2) / W * 100) + "%";
  cam.style.top = ((f.hy - dh / 2) / H * 100) + "%";
}
cam.addEventListener("loadedmetadata", layout);
cam.addEventListener("resize", layout);

/* ---------- Cámara y permisos ---------- */
function isPermErr(e) { const n = e && e.name; return n === "NotAllowedError" || n === "SecurityError" || n === "PermissionDeniedError"; }

async function camState() {           // "granted" | "prompt" | "denied" | "unknown"
  try {
    const st = await navigator.permissions.query({ name: "camera" });
    if (permStatus && permStatus !== st) permStatus.onchange = null;
    permStatus = st;
    st.onchange = () => onPerm(st.state);
    return st.state;
  } catch (e) { return "unknown"; }
}
function onPerm(state) {
  dbg("permiso", "cambió a " + state);
  if (finished) return;
  if (state === "granted" && !stream && !starting) startCam();
  else if (state === "denied" && stream) { stopStream(); explain({ name: "NotAllowedError" }); }
}
function stopStream() {
  if (stream) stream.getTracks().forEach(t => { t.onended = null; t.stop(); });
  stream = null; cam.srcObject = null;
}
function showStart(label) {
  $("start").hidden = false; $("start").disabled = false; $("start").textContent = label;
  $("shoot").hidden = true; $("flip").hidden = true;
}
function waitVideo(ms) {              // espera a que la imagen de la cámara realmente exista
  return new Promise(res => {
    const t0 = Date.now();
    (function chk() {
      if (cam.videoWidth > 0 && cam.readyState >= 2) return res(true);
      if (Date.now() - t0 > ms) return res(false);
      setTimeout(chk, 60);
    })();
  });
}

/* Explica el problema real. Solo dice «bloqueada» si el navegador confirma que lo está. */
async function explain(err) {
  const n = err && err.name, st = await camState();
  needPerm = false; $("reload").hidden = true;
  const where = isIOS ? "toca «aA» en la barra de direcciones → Ajustes del sitio web → Cámara → Permitir"
                      : "toca el candado (o el ícono de ajustes) junto al enlace → Permisos → Cámara → Permitir";
  dbg("camara", "mensaje al usuario para " + n, { permiso: st });
  if (isPermErr(err)) {
    needPerm = true;
    if (st === "denied") {
      msg.innerHTML = "<b>La cámara está bloqueada para este sitio.</b><br>" + where.charAt(0).toUpperCase() + where.slice(1) + ". Luego pulsa el botón." + APP_HINT;
      showStart("Ya la permití, reintentar"); $("reload").hidden = false;
    } else if (st === "granted") {
      msg.textContent = "El sitio tiene permiso, pero el teléfono no deja usar la cámara. Revisa Ajustes → Apps → tu navegador → Permisos → Cámara." + APP_HINT;
      showStart("Reintentar"); $("reload").hidden = false;
    } else if (st === "prompt") {
      msg.textContent = "Necesitamos tu permiso para usar la cámara. Pulsa «Activar cámara» y luego toca «Permitir».";
      showStart("Activar cámara");
    } else {
      msg.textContent = "No pudimos acceder a la cámara. Si apareció un aviso, toca «Permitir». Si no, " + where + "." + APP_HINT;
      showStart("Reintentar"); $("reload").hidden = false;
    }
  } else if (n === "NotFoundError" || n === "DevicesNotFoundError") {
    msg.textContent = "No se encontró ninguna cámara en este dispositivo."; showStart("Reintentar");
  } else if (n === "NotReadableError" || n === "AbortError" || n === "TrackStartError" || n === "NoVideo") {
    msg.textContent = "La cámara está ocupada o no respondió. Cierra otras apps que la usen y pulsa «Reintentar»."; showStart("Reintentar");
  } else {
    msg.textContent = "No se pudo abrir la cámara. Pulsa «Reintentar»." + APP_HINT; showStart("Reintentar");
  }
}

async function openCamera() {
  stopStream();
  const attempts = [
    { video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
    { video: { facingMode: facing }, audio: false },
    { video: true, audio: false }
  ];
  let err = null, got = null;
  for (let i = 0; i < attempts.length; i++) {
    const t = performance.now();
    dbg("camara", "getUserMedia intento " + (i + 1), JSON.stringify(attempts[i].video));
    try { got = await navigator.mediaDevices.getUserMedia(attempts[i]); dbg("camara", "intento " + (i + 1) + " OK en " + Math.round(performance.now() - t) + " ms"); break; }
    catch (e) {
      err = e; err._ms = Math.round(performance.now() - t);
      dbg("camara", "intento " + (i + 1) + " falló: " + e.name + " – " + e.message + " (" + err._ms + " ms)");
      if (isPermErr(e) || e.name === "NotFoundError") break;     // reintentar con otros ajustes no sirve
    }
  }
  if (!got) throw err || new Error("sin cámara");
  stream = got; cam.srcObject = stream;
  try { await cam.play(); } catch (e) { dbg("camara", "play() rechazado: " + e.name); }
  if (!(await waitVideo(6000))) { const e = new Error("la cámara no entregó imagen"); e.name = "NoVideo"; throw e; }
  const tr = stream.getVideoTracks()[0], s = (tr.getSettings && tr.getSettings()) || {};
  facing = s.facingMode === "environment" ? "environment" : "user";
  mirrored = facing === "user";                       // cámara frontal = espejo (webcams sin dato también)
  cam.classList.toggle("mirror", mirrored);
  layout();
  dbg("camara", "lista", { etiqueta: tr.label, ancho: s.width, alto: s.height, fps: s.frameRate, facing: s.facingMode || "n/d", espejo: mirrored });
  tr.onended = () => {                                // el sistema cortó la cámara (llamada, otra app, segundo plano)
    dbg("camara", "el sistema detuvo la cámara");
    if (finished) return;
    stream = null; cam.srcObject = null;
    msg.textContent = "La cámara se detuvo. Pulsa «Reactivar cámara».";
    showStart("Reactivar cámara");
  };
  $("start").hidden = true; $("start").textContent = "Activar cámara";
  $("shoot").hidden = false;
  let cams = 2;
  try { cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput").length; } catch (e) {}
  $("flip").hidden = cams < 2;                        // sin segunda cámara no se muestra «Girar»
  msg.textContent = "Coloca tu cara dentro del círculo y pulsa «Tomar foto».";
}

async function startCam() {
  if (starting || finished) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    dbg("camara", "sin soporte de cámara", { https: window.isSecureContext, mediaDevices: !!navigator.mediaDevices });
    msg.textContent = inApp ? "Estás en el navegador de otra app. Abre este enlace en Chrome o Safari."
                            : "Este navegador no permite usar la cámara. Abre el enlace en Chrome o Safari.";
    return;
  }
  starting = true; $("start").disabled = true; $("reload").hidden = true;
  msg.textContent = "Abriendo cámara… si aparece un aviso, toca «Permitir».";
  const before = camState();                          // sin esperar: getUserMedia se llama de inmediato
  const t0 = performance.now();
  try {
    await openCamera();
    autoRetried = false; needPerm = false;
  } catch (e) {
    stopStream();
    const ms = Math.round(performance.now() - t0), b = await before, a = await camState();
    dbg("camara", "FALLÓ", { error: e && e.name, mensaje: e && e.message, ms, permisoAntes: b, permisoDespues: a });
    if (isPermErr(e) && !autoRetried && ms < 450 && a !== "denied") {
      /* Rechazo casi instantáneo y el permiso NO está bloqueado: la persona no llegó a decidir
         (pasa al abrir desde otra app o con la página aún cargando). Se reintenta una vez. */
      autoRetried = true;
      dbg("camara", "rechazo instantáneo sin decisión de la persona → reintento automático");
      setTimeout(() => { if (!stream && !starting && !finished) startCam(); }, 700);
    } else {
      await explain(e);
    }
  } finally {
    starting = false; $("start").disabled = false;
  }
}

/* Si ya hay permiso, abre sola (sin aviso). Si cambia el permiso o se vuelve a la página, se adapta. */
(async () => {
  if (!navigator.mediaDevices) return;
  const st = await camState();
  dbg("permiso", "estado inicial: " + st);
  if (st === "granted" && !document.hidden) startCam();
})();
document.addEventListener("visibilitychange", () => {
  if (finished) return;
  if (document.hidden) { if (stream) { stopStream(); resumeOnShow = true; dbg("camara", "página oculta: cámara liberada"); } }
  else if (resumeOnShow) { resumeOnShow = false; startCam(); }
  else if (needPerm && !stream && !starting) {         // volvió de los ajustes del navegador
    camState().then(s => { if (s === "granted") startCam(); });
  }
});
addEventListener("pageshow", e => {                    // volver con el botón «atrás»
  if (e.persisted && !finished && !stream && !starting) { dbg("pagina", "restaurada desde caché"); startCam(); }
});

/* ---------- Foto ---------- */
async function shoot() {
  if (shooting || finished) return;
  if (!stream || !cam.videoWidth) { msg.textContent = "Un momento, la cámara aún no está lista."; dbg("foto", "intento sin imagen de cámara"); return; }
  shooting = true;
  try {
    const f = FRAMES[idx];
    if (!(f.img.complete && f.img.naturalWidth)) { try { await f.img.decode(); } catch (e) {} }
    if (!f.img.naturalWidth) throw new Error("el marco no cargó");
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    const { dw, dh } = fit();
    g.save();
    if (mirrored) { g.translate(W, 0); g.scale(-1, 1); }
    g.drawImage(cam, (mirrored ? W - f.hx : f.hx) - dw / 2, f.hy - dh / 2, dw, dh);
    g.restore();
    g.drawImage(f.img, 0, 0, W, H);
    const b = await new Promise(res => c.toBlob(res, "image/jpeg", 0.93));
    if (!b) throw new Error("no se pudo crear la imagen");
    if (photoURL) URL.revokeObjectURL(photoURL);
    blob = b; photoURL = URL.createObjectURL(b); finished = true;
    result.src = photoURL; result.style.display = "block";
    document.body.classList.add("done");
    $("live").hidden = true; $("done").hidden = false;
    msg.textContent = "¿Te gusta? Descárgala o súbela para sumar puntos.";
    stopStream();
    dbg("foto", "tomada", { marco: f.id, bytes: b.size, video: cam.videoWidth + "x" + cam.videoHeight });
  } catch (e) {
    dbg("ERROR", "foto: " + e.message);
    msg.textContent = "No se pudo tomar la foto. Inténtalo de nuevo.";
  } finally { shooting = false; }
}

function filename() { return "osole-baby-" + FRAMES[idx].id + ".jpg"; }

/* Botón 2: descargar y guardar */
async function saveFoto() {
  if (!blob) return;
  if (IOS_SAVE_WITH_SHARE && isIOS && navigator.canShare) {
    const file = new File([blob], filename(), { type: "image/jpeg" });
    if (navigator.canShare({ files: [file] })) {
      try {
        dbg("foto", "iPhone: menú de compartir"); await navigator.share({ files: [file] });
        msg.textContent = "Listo. Si elegiste «Guardar imagen», ya está en tus fotos."; return;
      } catch (e) { dbg("foto", "compartir: " + e.name); if (e.name === "AbortError") return; }
    }
  }
  const a = document.createElement("a");
  a.href = photoURL; a.download = filename();
  document.body.appendChild(a); a.click(); a.remove();
  dbg("foto", "descarga lanzada: " + filename());
  msg.textContent = isIOS ? "¡Foto descargada! Búscala en Archivos → Descargas (o en el ícono de descargas de Safari)."
                          : "¡Foto descargada! Si no la ves, mantén presionada la imagen y elige «Guardar imagen».";
}

/* Botón 3: ir a sumar puntos (misma pestaña) */
function goPoints() {
  if (going) return; going = true;
  dbg("ui", "ir a sumar puntos");
  window.location.href = POINTS_URL;
}

/* Botón 1: repetir */
function retry() {
  dbg("ui", "repetir foto");
  finished = false; going = false;
  result.style.display = "none"; result.removeAttribute("src");
  document.body.classList.remove("done");
  $("done").hidden = true; $("live").hidden = false;
  startCam();
}

$("start").onclick = () => { autoRetried = false; startCam(); };
$("reload").onclick = () => { dbg("ui", "recargar página"); location.reload(); };
$("shoot").onclick = shoot;
$("flip").onclick = () => { if (starting) return; facing = facing === "user" ? "environment" : "user"; dbg("ui", "girar cámara → " + facing); startCam(); };
$("retry").onclick = retry;
$("download").onclick = saveFoto;
$("points").onclick = goPoints;
select(0);
if (/[?&]debug(=1|=true|&|$)/.test(location.search)) dbgSet(true);

/* ---------- Monito que salta y saluda ---------- */
(function () {
  const m = $("monkey");
  if (!m || matchMedia("(prefers-reduced-motion: reduce)").matches) { if (m) m.classList.add("wave"); return; }
  const inner = m.querySelector(".m-in");
  const HOP_MS = 650, HOP_H = 22, WAVE_MS = 2600;
  let x = 0, from = 0, to = 0, hops = 0, state = "wave", t0 = performance.now(), last = t0;
  const range = () => { const w = m.offsetWidth; const pad = innerWidth * 0.04; return [pad, Math.max(pad, innerWidth - w - pad)]; };
  x = range()[0]; m.classList.add("wave");
  function startHops() {
    const [lo, hi] = range(); from = x; to = Math.abs(x - lo) < 2 ? hi : lo;
    hops = Math.max(2, Math.round(Math.abs(to - from) / 70)); state = "hop"; t0 = performance.now();
    m.classList.remove("wave");
  }
  function frame(now) {
    if (now - last > 500) t0 += now - last;             // la pestaña estuvo oculta
    last = now;
    let y = 0, sq = 1;
    if (state === "wave") {
      if (now - t0 > WAVE_MS) startHops();
    } else {
      const total = hops * HOP_MS, e = Math.min(now - t0, total);
      const k = (e % HOP_MS) / HOP_MS;
      x = from + (to - from) * (e / total);
      y = HOP_H * 4 * k * (1 - k);
      sq = (k < .12 || k > .88) ? .9 : 1.03;            // aplasta al caer y estira en el aire
      if (now - t0 >= total) { x = to; y = 0; sq = 1; state = "wave"; t0 = now; m.classList.add("wave"); }
    }
    m.style.transform = "translate3d(" + x.toFixed(1) + "px," + (-y).toFixed(1) + "px,0)";
    inner.style.transform = "scaleY(" + sq + ")";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
